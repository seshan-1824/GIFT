<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>For You ❤️</title>
<style>
body{margin:0;background:#050507;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Georgia,serif;overflow:hidden}
canvas{width:min(90vw,650px);height:auto}.note{color:#ffb6cc;font-size:20px;text-align:center}.back{margin-top:18px;color:#fff;background:#d4144e;padding:12px 30px;border-radius:30px;text-decoration:none}
</style>
</head>
<body>
<canvas id="c" width="650" height="600"></canvas>
<div class="note">Made with ❤️</div>
<a class="back" href="lovee.html">← Back</a>
<script>
if (sessionStorage.getItem("unlocked") !== "yes") {
    location.href = "index.html";
}

const c = document.getElementById("c");
const ctx = c.getContext("2d");

const points = [];

for (let t = 0; t <= Math.PI * 2; t += 0.02) {

    // Proper heart shape
    const x = 325 + 15 * (16 * Math.pow(Math.sin(t), 3));

    const y = 300 - 15 * (
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t)
    );

    points.push([x, y]);
}

let i = 0;

function drawHeart() {

    if (i < points.length) {

        const p = points[i++];

        if (i === 1) {
            ctx.beginPath();
            ctx.moveTo(p[0], p[1]);
        } else {
            ctx.lineTo(p[0], p[1]);
        }

        ctx.strokeStyle = "#ff315f";
        ctx.lineWidth = 4;
        ctx.shadowBlur = 20;
        ctx.shadowColor = "#ff315f";

        ctx.stroke();

        requestAnimationFrame(drawHeart);

    } else {

        // Fill the heart
        ctx.beginPath();

        points.forEach((p, index) => {
            if (index === 0) {
                ctx.moveTo(p[0], p[1]);
            } else {
                ctx.lineTo(p[0], p[1]);
            }
        });

        ctx.closePath();

        ctx.fillStyle = "#ff174f";
        ctx.shadowBlur = 30;
        ctx.shadowColor = "#ff174f";

        ctx.fill();
    }
}

drawHeart();
</script>
</body>
</html>
